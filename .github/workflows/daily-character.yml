name: Daily Character Cron

on:
  schedule:
    - cron: "0 3 * * *" # 00:00 BRT (03:00 UTC)
  workflow_dispatch:

jobs:
  trigger-daily-character:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar API route
        run: |
          curl -f -X GET "https://jojodle-jet.vercel.app/api/cron/daily-character" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"